name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recrutai_db
          POSTGRES_USER: recrutai_user
          POSTGRES_PASSWORD: recrutai_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recrutai_user -d recrutai_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: localhost
      POSTGRES_DB: recrutai_db
      POSTGRES_USER: recrutai_user
      POSTGRES_PASSWORD: recrutai_pass
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # CPU-only torch keeps whisper's install small (no CUDA wheels)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/recrutai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        # package-lock.json is git-ignored for this package, so npm ci is not possible
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: Build
        # CI=true makes Create React App treat any lint warning as a build failure
        run: npm run build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: http://localhost:8000
